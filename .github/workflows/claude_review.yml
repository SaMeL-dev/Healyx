name: Claude PR Review

on:
  # PR 코멘트에 "@claude" 멘션 시 수동 실행
  issue_comment:
    types: [created]

  # GitHub Actions 탭에서 직접 실행 (PR 번호 입력)
  workflow_dispatch:
    inputs:
      pr_number:
        description: '검토할 PR 번호'
        required: true
        type: string

jobs:
  claude-review:
    # 코멘트 트리거: PR 코멘트 + "@claude" 포함한 경우만
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          direct_prompt: |
            CLAUDE.md에 정의된 HEALYX 프로젝트 컨벤션을 기준으로 이 PR을 검토해줘.

            반드시 아래 순서로 검토하고, 각 섹션별로 결과를 작성해:

            ## 1. 변경 요약
            - 어떤 기능/수정인지 2~3줄로 요약
            - 영향 받는 도메인 (auth / hospital / review / cost / translation / community)

            ## 2. 필수 체크리스트
            각 항목을 ✅ (통과) / ⚠️ (주의) / ❌ (위반) / ➖ (해당 없음) 으로 표시:

            | 항목 | 결과 | 비고 |
            |---|---|---|
            | API 응답 형식 `{success, data}` 준수 | | |
            | 인증/권한 처리 (비로그인 허용 API 외 @PreAuthorize 또는 SecurityConfig 설정) | | |
            | 병원 식별자 ykiho(String) 사용 (hospitalId Long 미사용) | | |
            | Redis key 패턴 및 TTL 설정 | | |
            | 유효성 검사 — 별점(1~5) / 본문(2000자) / 이미지(5장) | | |
            | 리뷰 삭제 순서 — S3 → review_images → reviews | | |
            | 패키지 구조 `com.smu.healyx.{도메인}.{레이어}` | | |
            | S3 디렉토리 경로 (receipts/ vs reviews/) | | |
            | 민감정보 로깅 방지 | | |

            ## 3. 발견된 문제
            - ❌ 심각 (머지 전 반드시 수정): 명확한 버그, 보안 취약점, 컨벤션 위반
            - ⚠️ 권고 (수정 권장): 잠재적 문제, 코드 품질 개선 여지
            - 💡 제안 (선택): 더 나은 구현 방식

            ## 4. 긍정적인 부분
            잘 작성된 코드나 개선된 부분 언급

            문제가 없으면 "검토 완료 — HEALYX 컨벤션 이상 없음 ✅" 로 마무리.

          allowed_tools: "Bash,Read,Glob,Grep"
